[project]
name = "clean-app"
version = "0.1.0"
description = "A clean architecture sample implementation using FastAPI, SQLModel, and PostgreSQL"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Manish Sharma", email = "mansha99@gmail.com" }]
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "sqlmodel>=0.0.16",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "greenlet>=3.5.6",
    "ruff>=0.17.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "black>=24.2.0",
    "mypy>=1.9.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py311']

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
[tool.ruff]
# Set the maximum line length to 79.
line-length = 128
[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
